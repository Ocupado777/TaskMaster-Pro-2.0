<div class="auth-container">
  <div class="auth-card">
    <div class="brand-mark">TM</div>
    <span class="eyebrow">TaskMaster Pro</span>
    <h1>Haz espacio para lo importante.</h1>
    <p class="auth-intro">Crea tu cuenta y convierte tus pendientes en un ritmo de trabajo más claro.</p>

    <form class="auth-form" (ngSubmit)="registrarUsuario()">
      <label for="nombre">Nombre completo</label>
      <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Tu nombre" required />
      <label for="usuario">Nombre de usuario</label>
      <input id="usuario" type="text" [(ngModel)]="usuario" name="usuario" placeholder="ej. maria_23" required />
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="correo@ejemplo.com" required />
      <label for="password">Contraseña</label>
      <input id="password" type="password" [(ngModel)]="password" name="password" placeholder="Crea una contraseña" required />
      <button type="submit" class="btn-auth-primary">Crear mi cuenta</button>
    </form>
    <p class="auth-footer-link">¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión</a></p>
  </div>

  <div class="toast-flotante" *ngIf="mensajeToast">{{ mensajeToast }}</div>
</div>
