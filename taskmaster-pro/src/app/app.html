<!-- El Sidebar solo se muestra si no estamos en login o register -->
<app-sidebar *ngIf="mostrarSidebar"></app-sidebar>

<div class="usuario-menu" *ngIf="mostrarSidebar && dataService.usuario()">
	<button class="usuario-trigger" type="button" (click)="menuUsuarioAbierto = !menuUsuarioAbierto" [attr.aria-expanded]="menuUsuarioAbierto">
		<span class="usuario-avatar">
			<img *ngIf="dataService.usuario()?.avatar" [src]="dataService.usuario()?.avatar" alt="" />
			<span *ngIf="!dataService.usuario()?.avatar">{{ inicialesUsuario }}</span>
		</span>
		<span class="usuario-identidad"><strong>{{ dataService.usuario()?.nombre || 'Usuario' }}</strong><small>{{ dataService.usuario()?.email }}</small></span>
		<span class="usuario-chevron" aria-hidden="true">⌄</span>
	</button>
	<div class="usuario-dropdown" *ngIf="menuUsuarioAbierto">
		<button type="button" (click)="irAPerfil()">○ <span>Mi perfil</span></button>
		<button type="button" class="salir" (click)="cerrarSesion()">↪ <span>Cerrar sesión</span></button>
	</div>
</div>

<main [class.with-sidebar]="mostrarSidebar">
	<router-outlet></router-outlet>
</main>
